<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda con DummyJSON - API</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="barraLateral">
        <div class="buscador">
            <input type="text" id="buscar" placeholder="¿Qué estas buscando?" />
            <button type="button" id="boton">Buscar</button>
        </div>
        <div class="categoria">
            <h1>Categorias</h1>
            <select name="filtrarCategoria" id="filtrarCategoria">
                <option value="todas">Todas las categorías</option>
            </select>
            <h2>Filtrar</h2>
            <input type="number" id="filtrarPrecio" min="0" placeholder="Precio minimo">
        </div>
    </div>
    <main>
        <p id="cargando">Cargando productos...</p>
        <div class="container"> </div>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
