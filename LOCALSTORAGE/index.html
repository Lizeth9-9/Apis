<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de imágenes con favoritos - API</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #cca6b6c7;
        /* font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; */
    }

    #contador {
        font-weight: bold;
        color: #ffffff;
        padding: 10px 24px;
        border-radius: 30px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        margin-bottom: 20px;
        position: fixed;
        top: 20px;
        right:20px;
        font-size: 20px;
        z-index: 10;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 20px;
    }

    .card {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .card2 {
        overflow: hidden;
        border-radius: 8px;
        background: white;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .card2 h1 {
        margin-top: 20px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        font-size: 25px;
    }

    .card2 img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
        border-radius: 8px;
    }

    .card2 button {
        margin-top: 8px;
        padding: 8px 15px;
        font-size: 50px;
        border: none;
        border-radius: 6px;
        background-color: #fcf2f2;
        color: white;
        cursor: pointer;

    }

    .card2 button.activo {
        background-color: #ffffff;
        color: white;
    }

    .card2 button:hover {
        background-color: #e7dcdc;
    }

    .skeleton {
        background: white;
        border-radius: 12px;
        padding: 10px;
        height: 300px;
    }

    .skeleton .skeleton-box {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
        background-size: 200% 100%;
        animation: pulso 1.5s infinite;
    }

    @keyframes pulso {
        0% {
            background-position: 200% 0;
        }

        100% {
            background-position: -200% 0;
        }
    }

    @media (max-width: 768px) {
        .container {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>

<body>

    <p id="contador">Favoritos: </p>

    <div class="container"></div>




    <script src="js/main.js"></script>
</body>

</html>
