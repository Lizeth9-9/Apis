<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de imágenes con favoritos - API</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #e6d5dc81;
        /* font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; */
    }

    .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        padding: 20px;
    }

    .card {
        overflow: hidden;
        border-radius: 8px;
    }

    .card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        display: block;
    }

    .card button {
        margin-top: 8px;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background-color: #333;
        color: white;
        cursor: pointer;
    }

    .card button.activo {
        background-color: #e63950;
        color: white;
    }

    .card button:hover {
        background-color: #555;
    }


    @media (max-width: 768px) {
        .container {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>

<body>

    <div class="container"></div>




    <script src="js/main.js"></script>
</body>

</html>
